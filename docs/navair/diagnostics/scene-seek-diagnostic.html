<!doctype html><title>Local video seek diagnostic</title><video muted playsinline style="width:640px;max-width:100%"></video><pre id="results">Measuring decoded video seeks without the globe or scrolling libraries…</pre><script>
(async()=>{const v=document.querySelector('video'),out=document.querySelector('pre'),results=[];const event=n=>new Promise((ok,no)=>{let t=setTimeout(()=>no(Error(n+' timeout')),10000);v.addEventListener(n,()=>{clearTimeout(t);ok()},{once:true})});for(const name of ['mobile','scroll']){let start=performance.now();const blob=await(await fetch('/video/scene01-'+name+'.mp4')).blob(),url=URL.createObjectURL(blob);const load=event('loadeddata');v.src=url;await load;let seeks=[];for(let i=1;i<=60;i++){const target=((i%2)?i/61:1-i/61)*(v.duration-.1),done=event('seeked'),t=performance.now();v.currentTime=target;await done;seeks.push(performance.now()-t);await new Promise(requestAnimationFrame)}const sorted=[...seeks].sort((a,b)=>a-b);results.push({asset:name,bytes:blob.size,seeks:seeks.length,medianMs:sorted[30],p95Ms:sorted[57],maxMs:sorted[59],elapsedMs:performance.now()-start});out.textContent=JSON.stringify(results,null,2);URL.revokeObjectURL(url)}out.dataset.complete='true'})().catch(e=>document.querySelector('pre').textContent=String(e));
</script>
